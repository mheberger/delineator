[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delineator"
version = "2.0"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=0.13",
    "shapely>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pysheds>=0.5",
    "pyproj>=3.6",
    "click>=8.0",
    "pooch>=1.7",
    "platformdirs>=3.0",
]

[project.scripts]
delineate = "delineator.cli:main"
show_data_dir = "delineator.cli:show_data_dir"